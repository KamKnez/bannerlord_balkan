[text]
en = """
Venice has pushed its Dalmatian border deep inland, taking Knin, Sinj and Vrlika. The coast belongs to the Lion of Saint Mark, the hinterland to Morlach captains who serve the Republic for land and pay.
"""
de = """
Venedig hat seine dalmatinische Grenze weit ins Hinterland geschoben und Knin, Sinj und Vrlika genommen. Die Küste gehört dem Markuslöwen, das Hinterland morlakischen Hauptleuten, die der Republik für Land und Sold dienen.
"""

[herrscher_text]
en = "Alvise Mocenigo is Provveditore Generale of Dalmatia and Albania. He governs the province on behalf of the Doge."
de = "Alvise Mocenigo ist Provveditore generale für Dalmatien und Albanien. Er verwaltet die Provinz im Namen des Dogen."


