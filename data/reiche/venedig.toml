# Beschreibungen für die Enzyklopädie (Stand um 1700). Dörfer bekommen einen der dorftexte;
# {DORF} wird durch den Dorfnamen ersetzt, {SITZ} durch die Stadt oder Burg, zu der es gehört.
[ortstexte]
town_EW2 = { en = "Zadar is the capital of Venetian Dalmatia and the seat of the Provveditore generale. The winged lion of St Mark watches over its Land Gate.", de = "Zadar ist die Hauptstadt des venezianischen Dalmatien und Sitz des Provveditore generale. Über dem Landtor wacht der geflügelte Löwe von San Marco." }
town_EW4 = { en = "Šibenik is known for its cathedral of St James, built entirely of stone. The fortresses of St Nicholas and Barone protect it from sea and land.", de = "Šibenik ist bekannt für seine ganz aus Stein gebaute Kathedrale des heiligen Jakob. Die Festungen Sankt Nikolaus und Barone schützen die Stadt von See und Land." }
town_EW5 = { en = "Kotor lies at the end of a deep bay. Its walls climb the mountain behind the town, and its seafarers sail under the banner of St Mark.", de = "Kotor liegt am Ende einer tiefen Bucht. Seine Mauern klettern den Berg hinter der Stadt hinauf, und seine Seeleute fahren unter dem Banner von San Marco." }
town_EW6 = { en = "Split grew inside the palace of the emperor Diocletian. Its great lazaretto receives caravans from Bosnia, and much of the trade with the Ottoman lands passes through here.", de = "Split ist im Palast des Kaisers Diokletian gewachsen. Sein großes Lazarett nimmt Karawanen aus Bosnien auf, und ein großer Teil des Handels mit dem Osmanischen Reich läuft hier durch." }
castle_EW1 = { en = "Trogir is a small walled town on an islet, guarded by the Kamerlengo fortress.", de = "Trogir ist eine kleine ummauerte Stadt auf einer Insel, bewacht von der Festung Kamerlengo." }
castle_EW3 = { en = "Makarska, a harbour below the steep wall of Biokovo, came under Venice in 1684.", de = "Makarska, ein Hafen unter der steilen Wand des Biokovo, kam 1684 an Venedig." }
castle_EW4 = { en = "Knin was taken in 1688. Its fortress on the ridge above the Krka is the key to the Dalmatian hinterland.", de = "Knin wurde 1688 erobert. Seine Festung auf dem Bergrücken über der Krka ist der Schlüssel zum dalmatinischen Hinterland." }
town_EW1 = { en = "Venezia is the capital of the Republic. Its head of state is the Doge, and the Great Council holds the legislative power. The Arsenal can build, equip and provision fleets of war galleys on a scale unmatched elsewhere in Europe.", de = "Venedig ist die Hauptstadt der Republik. Ihr Staatsoberhaupt ist der Doge, die gesetzgebende Gewalt liegt beim Großen Rat. Das Arsenal kann Flotten von Kriegsgaleeren in einem Umfang bauen, ausrüsten und versorgen, den sonst niemand in Europa erreicht." }
town_EW3 = { en = "Preveza lies on the northern peninsula at the mouth of the Ambracian Gulf. The Venetians took its castle in September 1684 after a siege of eight days. At the end of the war in 1699 the town was handed back to Ottoman rule.", de = "Preveza liegt auf der nördlichen Halbinsel an der Mündung des Ambrakischen Golfs. Die Venezianer nahmen seine Burg im September 1684 nach acht Tagen Belagerung. Am Ende des Kriegs 1699 wurde die Stadt an die Osmanen zurückgegeben." }
castle_EW2 = { en = "Udine has been the capital of Friuli since 1238. Venice has ruled the land since 1420 through a Luogotenente who resides in Udine. The town hall, the Loggia del Lionello, is built in the Venetian Gothic style, and the clock tower resembles the one on St Mark's Square in Venice.", de = "Udine ist seit 1238 die Hauptstadt des Friaul. Venedig regiert das Land seit 1420 durch einen Luogotenente, der in Udine residiert. Das Rathaus, die Loggia del Lionello, ist im Stil der venezianischen Gotik gebaut, und der Uhrturm gleicht dem am Markusplatz in Venedig." }
castle_EW5 = { en = "Venice has ruled Pula since 1331. War, plague, malaria and typhoid have ravaged the town. The great Roman amphitheatre and the Temple of Augustus on the forum date from its ancient past.", de = "Venedig herrscht seit 1331 über Pula. Krieg, Pest, Malaria und Typhus haben die Stadt verheert. Das große römische Amphitheater und der Augustustempel am Forum stammen aus ihrer antiken Vergangenheit." }
castle_EW6 = { en = "The Venetians captured Patras from the Ottomans in 1687 during the Morean War. It is the capital of Achaia, one of the four provinces of the Venetian Kingdom of the Morea.", de = "Die Venezianer nahmen Patras 1687 im Moreakrieg den Osmanen ab. Es ist die Hauptstadt von Achaia, einer der vier Provinzen des venezianischen Königreichs Morea." }
castle_EW7 = { en = "Nauplia, in Italian Napoli di Romania, is the capital of the Venetian Kingdom of the Morea. The Venetians won it back in the Morean War. The Bourtzi, the fort in the harbour, was built by the Venetians in the 1470s.", de = "Nauplia, italienisch Napoli di Romania, ist die Hauptstadt des venezianischen Königreichs Morea. Die Venezianer gewannen es im Moreakrieg zurück. Das Bourtzi, das Fort im Hafen, bauten die Venezianer in den 1470er Jahren." }
castle_EW8 = { en = "Modon was an important staging point on the route between Venice and the Holy Land. It fell to the Ottomans on 9 August 1500 after a siege of 28 days. The Venetians returned under Francesco Morosini in 1686 and repaired the castle.", de = "Modon war eine wichtige Zwischenstation auf dem Weg von Venedig ins Heilige Land. Am 9. August 1500 fiel es nach 28 Tagen Belagerung an die Osmanen. 1686 kehrten die Venezianer unter Francesco Morosini zurück und besserten die Burg aus." }

[[dorftext]]
en = "{DORF} is a village near {SITZ}. Morlach families who came from Ottoman lands in the war have settled here and serve Venice as frontier soldiers."
de = "{DORF} ist ein Dorf bei {SITZ}. Morlakische Familien, die im Krieg aus dem Osmanischen Reich kamen, haben sich hier niedergelassen und dienen Venedig als Grenzsoldaten."
[[dorftext]]
en = "{DORF} belongs to the lands of {SITZ}. Olives, wine and figs grow on its stony terraces."
de = "{DORF} gehört zum Land von {SITZ}. Auf seinen steinigen Terrassen wachsen Oliven, Wein und Feigen."
[[dorftext]]
en = "{DORF} lies on the coast near {SITZ}. Its men fish for sardines and row in the galleys when Venice calls."
de = "{DORF} liegt an der Küste bei {SITZ}. Seine Männer fangen Sardinen und rudern auf den Galeeren, wenn Venedig ruft."

