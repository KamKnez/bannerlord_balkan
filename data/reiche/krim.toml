# Krim-Khanat. Ersetzt Khuzait.
# Quellen: https://en.wikipedia.org/wiki/List_of_Crimean_khans und https://en.wikipedia.org/wiki/Devlet_II_Giray
# (Devlet II. Giray Khan 1699 bis 1702, ältester Sohn Selims I. Giray), https://en.wikipedia.org/wiki/Crimean_Khanate
# (Clans der Qaraçı Beys Şirin, Barın, Arğın, Qıpçaq; Nogai-Horden Budschak, Yedisan, Dschamboiluk, Yedickul als
# Vasallen; Hauptstadt Bahçeseray). Die Vornamen der Lords sind reihum aus data/namen/tataren.txt verteilt.
# Aufbau der Datei: siehe data/reiche/README.md

reich_id = "khuzait"
kultur_id = "khuzait"
kultur_wechseln = false
farben = ["FF2B7A9E", "FFE8C547"]
herrscher = "lord_6_1"
siedlungen = []

name = { en = "Crimean Khanate", de = "Krim-Khanat" }
kurzname = { en = "Crimean Tatars", de = "Krimtataren" }
titel = { en = "Khanate of Crimea", de = "Khanat der Krim" }
herrschertitel = { en = "Khan", de = "Khan" }

[text]
en = """
The khans of the house of Giray rule from Bahçeseray under the protection of the Ottoman Sultan, together with the beys of the clans Şirin, Barın, Arğın and Qıpçaq. The Nogai hordes of the steppe serve them as vassals. The Peace of Karlowitz in 1699 forbade further raids into the lands of their neighbours.
"""
de = """
Die Khane aus dem Haus Giray herrschen von Bachtschyssaraj aus unter dem Schutz des osmanischen Sultans, gemeinsam mit den Beys der Clans Şirin, Barın, Arğın und Qıpçaq. Die Nogai-Horden der Steppe dienen ihnen als Vasallen. Der Frieden von Karlowitz 1699 verbot weitere Raubzüge in die Länder der Nachbarn.
"""

[herrscher_text]
en = "Devlet II Giray, eldest son of Khan Selim I Giray, became Khan of Crimea in 1699."
de = "Devlet II. Giray, ältester Sohn des Khans Selim I. Giray, wurde 1699 Khan der Krim."

