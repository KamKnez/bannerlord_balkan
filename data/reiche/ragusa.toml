# Beschreibungen für die Enzyklopädie (Stand um 1700). Dörfer bekommen einen der dorftexte;
# {DORF} wird durch den Dorfnamen ersetzt, {SITZ} durch die Stadt oder Burg, zu der es gehört.
[ortstexte]
town_ES4 = { en = "Dubrovnik, the Republic of Ragusa, lives behind its great walls under the word Libertas. Its Rector changes every month, its ships sail every sea, and its tribute to the Sultan buys peace. The city is still recovering from the great earthquake of 1667.", de = "Dubrovnik, die Republik Ragusa, lebt hinter ihren mächtigen Mauern unter dem Wort Libertas. Ihr Rektor wechselt jeden Monat, ihre Schiffe befahren alle Meere, und ihr Tribut an den Sultan erkauft den Frieden. Von dem großen Erdbeben von 1667 erholt sich die Stadt noch immer." }
castle_ES3 = { en = "Ston guards the neck of the Pelješac peninsula with miles of walls. Its salt pans are among the Republic's richest treasures.", de = "Ston bewacht den Hals der Halbinsel Pelješac mit kilometerlangen Mauern. Seine Salinen gehören zu den reichsten Schätzen der Republik." }
town_ES1 = { en = "Ohrid lies on the shore of Lake Ohrid and is the seat of an archbishopric. According to a legend recorded by the traveller Evliya Çelebi, the town once had 365 churches.", de = "Ohrid liegt am Ufer des Ohridsees und ist Sitz eines Erzbistums. Nach einer Legende, die der Reisende Evliya Çelebi überliefert, hatte die Stadt einst 365 Kirchen." }
town_ES2 = { en = "Skadar lies where the lake of Skadar flows out into the river Bojana. Rozafa Castle rises imposingly on a rocky hill, and a market has been held here from the earliest times.", de = "Skadar liegt dort, wo der Skadarsee in die Bojana abfließt. Die Burg Rozafa erhebt sich mächtig auf einem Felshügel, und seit frühester Zeit wird hier Markt gehalten." }
town_ES3 = { en = "Gjirokastër lies in a valley between the Gjerë mountains and the river Drino. The town is overlooked by its fortress.", de = "Gjirokastër liegt in einem Tal zwischen dem Gjerë-Gebirge und dem Fluss Drino. Über der Stadt thront ihre Festung." }
town_ES5 = { en = "In Roman times the Via Egnatia started in Durrës. Under the Ottomans its importance declined greatly and it became a den of piracy. The traveller Evliya Çelebi counted about 150 houses here in 1670. The harbour is gradually silting up, but since the late 17th century the town has begun to recover.", de = "In römischer Zeit begann in Durrës die Via Egnatia. Unter den Osmanen verlor die Stadt stark an Bedeutung und wurde ein Piratennest. Der Reisende Evliya Çelebi zählte hier 1670 rund 150 Häuser. Der Hafen versandet nach und nach, doch seit dem späten 17. Jahrhundert erholt sich die Stadt." }
town_ES6 = { en = "Janina lies on the western shore of Lake Pamvotis. In the late 17th century it is a thriving town whose merchants trade with Venice and Livorno. The Epiphaniou School was founded here in 1647 and the Gioumeios School in 1676.", de = "Janina liegt am Westufer des Pamvotis-Sees. Im späten 17. Jahrhundert ist es eine blühende Stadt, deren Kaufleute mit Venedig und Livorno handeln. 1647 wurde hier die Epiphaniou-Schule gegründet, 1676 die Gioumeios-Schule." }
town_ES7 = { en = "Prizren has grown below its fortress along the river Bistrica, between the foothills of the Šar mountains. An Ottoman register of 1591 lists a quarter of the leatherworkers with 34 homes.", de = "Prizren ist unterhalb seiner Festung entlang der Bistrica gewachsen, zwischen den Ausläufern des Šar-Gebirges. Ein osmanisches Register von 1591 nennt ein Viertel der Lederarbeiter mit 34 Häusern." }
castle_ES1 = { en = "Nikšić, the old Onogošt, lies at the heart of the wide Nikšić field. The Ottomans took control of Onogošt in 1465, and between 1695 and 1703 mosques were built in the town.", de = "Nikšić, das alte Onogošt, liegt mitten im weiten Feld von Nikšić. Die Osmanen brachten Onogošt 1465 unter ihre Herrschaft, und zwischen 1695 und 1703 wurden in der Stadt Moscheen gebaut." }
castle_ES2 = { en = "The monastery of Cetinje is the seat of the Metropolitan of Montenegro. It was devastated in 1692, when the retreating Venetians mined it with a time bomb. Metropolitan Danilo had it rebuilt between 1701 and 1704.", de = "Das Kloster Cetinje ist der Sitz des Metropoliten von Montenegro. 1692 wurde es verwüstet, als die abziehenden Venezianer es mit einem Zeitzünder verminten. Metropolit Danilo ließ es zwischen 1701 und 1704 neu errichten." }
castle_ES4 = { en = "Old Bar stands on a hilltop at the foot of Mount Rumija and overlooks the Adriatic Sea. Near the town grows an olive tree that is said to be more than 2,000 years old.", de = "Das alte Bar steht auf einer Hügelkuppe am Fuß der Rumija und blickt auf die Adria. Bei der Stadt wächst ein Olivenbaum, der über 2.000 Jahre alt sein soll." }
castle_ES5 = { en = "Ulcinj is known as a base for piracy and remained a pirate haven even after the Ottoman conquest of 1571. At the end of the 16th century about 400 pirates from Malta, Tunisia and Algeria were based here.", de = "Ulcinj ist als Stützpunkt der Piraterie bekannt und blieb auch nach der osmanischen Eroberung von 1571 ein Piratenhafen. Ende des 16. Jahrhunderts hatten hier rund 400 Piraten aus Malta, Tunesien und Algerien ihren Sitz." }
castle_ES6 = { en = "The Venetians captured Vlorë in September 1690, and in 1691 the town was restored to the Ottomans. The surrounding region yields bitumen and salt, and nearby Selenica is well known for its bitumen mines.", de = "Die Venezianer nahmen Vlorë im September 1690 ein, 1691 fiel die Stadt an die Osmanen zurück. Die Umgebung liefert Bitumen und Salz, und das nahe Selenica ist für seine Bitumengruben bekannt." }
castle_ES7 = { en = "The name of Berat means White City. Its castle is built on a rocky hill on the right bank of the river Osum. Because of the way its houses are stacked on the slope, it is called the town of one window above the other.", de = "Der Name Berat bedeutet Weiße Stadt. Seine Burg steht auf einem Felshügel am rechten Ufer des Osum. Weil seine Häuser am Hang übereinander gestaffelt sind, nennt man es die Stadt der Fenster übereinander." }
castle_ES8 = { en = "Arta lies on the river Arachthos. The church of the Parigoritissa was built in about 1290 by Despot Nikephoros I Komnenos Doukas. The stone bridge of Arta in its present form is probably an Ottoman work of the 17th century.", de = "Arta liegt am Fluss Arachthos. Die Kirche der Parigoritissa ließ um 1290 der Despot Nikephoros I. Komnenos Dukas bauen. Die Steinbrücke von Arta ist in ihrer heutigen Gestalt wahrscheinlich ein osmanisches Werk des 17. Jahrhunderts." }

[[dorftext]]
en = "{DORF} is a village near {SITZ}. Its peasants work the land of Ragusan noble families and send wine and oil to the city."
de = "{DORF} ist ein Dorf bei {SITZ}. Seine Bauern bestellen das Land ragusanischer Adelsfamilien und schicken Wein und Öl in die Stadt."
[[dorftext]]
en = "{DORF} lies in the lands of {SITZ}. Many of its young men have gone to sea on Ragusan ships."
de = "{DORF} liegt im Land von {SITZ}. Viele seiner jungen Männer sind auf ragusanischen Schiffen zur See gefahren."
