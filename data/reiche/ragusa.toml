[text]
en = """
Ragusa pays tribute to the Sultan and stays under the protection of the Emperor. Its noble houses take turns as Rector, and its merchants are welcome in every port from Venice to Istanbul.
"""
de = """
Ragusa zahlt dem Sultan Tribut und steht unter dem Schutz des Kaisers. Seine Adelshäuser wechseln sich als Rektor ab, und seine Kaufleute sind in jedem Hafen von Venedig bis Istanbul willkommen.
"""

[herrscher_text]
en = "Frano Gozze is Rector of the Republic. His term is short, but the great families of the city stand behind him."
de = "Frano Gozze ist Rektor der Republik. Seine Amtszeit ist kurz, doch die großen Familien der Stadt stehen hinter ihm."


