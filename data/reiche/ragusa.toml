# Beschreibungen für die Enzyklopädie (Stand um 1700). Dörfer bekommen einen der dorftexte;
# {DORF} wird durch den Dorfnamen ersetzt, {SITZ} durch die Stadt oder Burg, zu der es gehört.
[ortstexte]
town_ES4 = { en = "Dubrovnik, the Republic of Ragusa, lives behind its great walls under the word Libertas. Its Rector changes every month, its ships sail every sea, and its tribute to the Sultan buys peace. The city is still recovering from the great earthquake of 1667.", de = "Dubrovnik, die Republik Ragusa, lebt hinter ihren mächtigen Mauern unter dem Wort Libertas. Ihr Rektor wechselt jeden Monat, ihre Schiffe befahren alle Meere, und ihr Tribut an den Sultan erkauft den Frieden. Von dem großen Erdbeben von 1667 erholt sich die Stadt noch immer." }
castle_ES3 = { en = "Ston guards the neck of the Pelješac peninsula with miles of walls. Its salt pans are among the Republic's richest treasures.", de = "Ston bewacht den Hals der Halbinsel Pelješac mit kilometerlangen Mauern. Seine Salinen gehören zu den reichsten Schätzen der Republik." }
town_ES1 = { en = "Ohrid lies on its deep, clear lake below an old fortress. It is the seat of an ancient archbishopric, and people say the town has a church for every day of the year.", de = "Ohrid liegt an seinem tiefen, klaren See unter einer alten Festung. Es ist der Sitz eines uralten Erzbistums, und man sagt, die Stadt habe für jeden Tag des Jahres eine Kirche." }
town_ES2 = { en = "Skadar lies where the river Bojana leaves the great lake, below the fortress of Rozafa. Boats carry its goods down to the sea, and its bazaar is the largest in northern Albania.", de = "Skadar liegt dort, wo die Bojana den großen See verlässt, unter der Festung Rozafa. Boote tragen seine Waren zum Meer hinab, und sein Basar ist der größte im Norden Albaniens." }
town_ES3 = { en = "Gjirokastër climbs a steep slope above the valley of the Drino. Its tall stone houses look like small fortresses, and a great castle crowns the ridge above them.", de = "Gjirokastër zieht sich einen steilen Hang über dem Tal des Drino hinauf. Seine hohen Steinhäuser sehen aus wie kleine Festungen, und eine große Burg krönt den Rücken über ihnen." }
town_ES5 = { en = "Durrës was once the great harbour where the Roman road to the East began. Today it is a small town inside walls that are far too wide for it, and its harbour is slowly silting up.", de = "Durrës war einst der große Hafen, an dem die römische Straße nach Osten begann. Heute ist es eine kleine Stadt in viel zu weiten Mauern, und sein Hafen versandet langsam." }
town_ES6 = { en = "Janina lies on a lake in the mountains of Epirus, with its castle on a rock above the water. Its merchants trade as far as Venice and Vienna, and its silversmiths and Greek schools are famous.", de = "Janina liegt an einem See in den Bergen von Epirus, die Burg auf einem Felsen über dem Wasser. Seine Kaufleute handeln bis Venedig und Wien, und seine Silberschmiede und griechischen Schulen sind berühmt." }
town_ES7 = { en = "Prizren lies on the Bistrica at the foot of the Šar mountains. Its gunsmiths, saddlers and silversmiths are known throughout the Balkans, and an old fortress looks down on its bridges and mosques.", de = "Prizren liegt an der Bistrica am Fuß des Šar-Gebirges. Seine Büchsenmacher, Sattler und Silberschmiede kennt man auf dem ganzen Balkan, und eine alte Festung blickt auf seine Brücken und Moscheen hinab." }
castle_ES1 = { en = "Nikšić, the old Onogošt, lies on a wide plain among the bare mountains of Herzegovina. Its fortress guards the caravan road that climbs up from Dubrovnik into the interior.", de = "Nikšić, das alte Onogošt, liegt auf einer weiten Ebene zwischen den kahlen Bergen der Herzegowina. Seine Festung bewacht den Karawanenweg, der von Dubrovnik ins Landesinnere hinaufführt." }
castle_ES2 = { en = "Cetinje is hardly more than a monastery on a stony plain below Mount Lovćen. Here the bishop of the Montenegrin tribes has his seat. The old monastery was blown up in the war of 1692, and a new one is being built.", de = "Cetinje ist kaum mehr als ein Kloster auf einer steinigen Ebene unter dem Lovćen. Hier hat der Bischof der montenegrinischen Stämme seinen Sitz. Das alte Kloster wurde im Krieg von 1692 gesprengt, ein neues entsteht." }
castle_ES4 = { en = "Bar stands on a rock below Mount Rumija, a little inland from its harbour. Olive groves that are many centuries old surround the walled town.", de = "Bar steht auf einem Felsen unter der Rumija, ein Stück landeinwärts von seinem Hafen. Jahrhundertealte Olivenhaine umgeben die ummauerte Stadt." }
castle_ES5 = { en = "Ulcinj is the corsair nest of the southern Adriatic. Its captains prey on merchant ships as far as Apulia, and its slave market is feared along the whole coast.", de = "Ulcinj ist das Korsarennest der südlichen Adria. Seine Kapitäne jagen Handelsschiffe bis nach Apulien, und sein Sklavenmarkt ist an der ganzen Küste gefürchtet." }
castle_ES6 = { en = "Vlorë lies on a wide bay opposite the heel of Italy. It lives on its salt pans, on the pitch from the nearby hills and on its harbour, which the Venetians held for a short time in the last war.", de = "Vlorë liegt an einer weiten Bucht gegenüber dem Absatz Italiens. Es lebt von seinen Salinen, vom Pech aus den nahen Hügeln und von seinem Hafen, den die Venezianer im letzten Krieg kurze Zeit besetzt hielten." }
castle_ES7 = { en = "Berat rises in rows of white houses from the river Osum up to its castle. So many windows look down the slope that it is called the town of a thousand windows.", de = "Berat steigt in Reihen weißer Häuser vom Fluss Osum zu seiner Burg hinauf. So viele Fenster blicken den Hang hinab, dass man es die Stadt der tausend Fenster nennt." }
castle_ES8 = { en = "Arta lies in a bend of the Arachthos, not far from the Ambracian Gulf. The town is known for its old stone bridge, for the churches of the despots of Epirus and for its orange gardens.", de = "Arta liegt in einer Schleife des Arachthos, nicht weit vom Ambrakischen Golf. Die Stadt ist bekannt für ihre alte Steinbrücke, die Kirchen der Despoten von Epirus und ihre Orangengärten." }

[[dorftext]]
en = "{DORF} is a village near {SITZ}. Its peasants work the land of Ragusan noble families and send wine and oil to the city."
de = "{DORF} ist ein Dorf bei {SITZ}. Seine Bauern bestellen das Land ragusanischer Adelsfamilien und schicken Wein und Öl in die Stadt."
[[dorftext]]
en = "{DORF} lies in the lands of {SITZ}. Many of its young men have gone to sea on Ragusan ships."
de = "{DORF} liegt im Land von {SITZ}. Viele seiner jungen Männer sind auf ragusanischen Schiffen zur See gefahren."
