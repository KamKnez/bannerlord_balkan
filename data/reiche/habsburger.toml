# Habsburgermonarchie. Ersetzt das Königreich Vlandia.
# Aufbau der Datei: siehe data/reiche/README.md

reich_id = "vlandia"
kultur_id = "vlandia"
kultur_wechseln = false
farben = ["FF1A1A1A", "FFE8C547"]
herrscher = "lord_4_1"

# Siedlungen, die die Kultur des Reichs bekommen (Städte und Burgen der Clans und ihre Dörfer)
siedlungen = []

name = { en = "Habsburg Monarchy", de = "Habsburgermonarchie" }
kurzname = { en = "Habsburgs", de = "Habsburger" }
titel = { en = "Kingdom of Croatia-Slavonia under the Habsburg Crown", de = "Königreich Kroatien-Slawonien unter der Habsburger Krone" }
herrschertitel = { en = "Ban", de = "Ban" }

[text]
en = """
After the Peace of Karlowitz the Habsburgs hold Croatia and Slavonia again up to the Una and the Sava. The emperor is far away in Vienna; on the frontier the Ban of Croatia leads the nobles and the border regiments.
"""
de = """
Nach dem Frieden von Karlowitz halten die Habsburger Kroatien und Slawonien wieder bis an Una und Save. Der Kaiser ist fern in Wien, an der Grenze führt der Ban von Kroatien den Adel und die Grenzregimenter.
"""

[herrscher_text]
en = "Adam Batthyány is Ban of Croatia. He fought in the great war against the Ottomans and now has to secure what was won."
de = "Adam Batthyány ist Ban von Kroatien. Er hat im großen Türkenkrieg gekämpft und muss nun sichern, was gewonnen wurde."


