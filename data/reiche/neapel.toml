# Königreich Neapel. Ersetzt Battania.
# Quellen: https://en.wikipedia.org/wiki/Kingdom_of_Naples (spanisches Vizekönigreich 1504 bis 1714),
# https://en.wikipedia.org/wiki/List_of_viceroys_of_Naples (Luis Francisco de la Cerda y Aragón Vizekönig 1696 bis 1702),
# Adelsfamilien des Königreichs: https://en.wikipedia.org/wiki/House_of_Carafa, https://en.wikipedia.org/wiki/House_of_Caracciolo,
# https://en.wikipedia.org/wiki/House_of_Pignatelli (Papst Innozenz XII., 1691 bis 1700), https://en.wikipedia.org/wiki/House_of_Sanseverino,
# https://en.wikipedia.org/wiki/House_of_%C3%81valos, https://en.wikipedia.org/wiki/House_of_Acquaviva; die Orsini als römische Familie
# (Herzöge von Bracciano, https://en.wikipedia.org/wiki/Orsini_family), weil Rom im Spiel zu diesem Reich gehört.
# Die Vornamen der Lords sind reihum aus data/namen/italiener.txt verteilt.
# Aufbau der Datei: siehe data/reiche/README.md

reich_id = "battania"
kultur_id = "battania"
kultur_wechseln = false
farben = ["FFF2C230", "FF8B1A1A"]
herrscher = "lord_5_1"
siedlungen = []

name = { en = "Kingdom of Naples", de = "Königreich Neapel" }
kurzname = { en = "Neapolitans", de = "Neapolitaner" }
titel = { en = "Viceroyalty of Naples under the Spanish Crown", de = "Vizekönigreich Neapel unter der spanischen Krone" }
herrschertitel = { en = "Viceroy", de = "Vizekönig" }

[text]
en = """
Since 1504 the Kingdom of Naples, with Campania, Calabria, Apulia, Basilicata, Abruzzo and Molise, has belonged to the Spanish crown and is governed by a Spanish viceroy. Its great houses, the Carafa, Caracciolo, Pignatelli and Sanseverino, sit in the capital. In this game the kingdom also holds Rome and the cities of the Papal States on the Adriatic.
"""
de = """
Seit 1504 gehört das Königreich Neapel mit Kampanien, Kalabrien, Apulien, der Basilikata, den Abruzzen und Molise zur spanischen Krone und wird von einem spanischen Vizekönig regiert. Seine großen Häuser, die Carafa, Caracciolo, Pignatelli und Sanseverino, sitzen in der Hauptstadt. Im Spiel gehören auch Rom und die Städte des Kirchenstaats an der Adria dazu.
"""

[herrscher_text]
en = "Luis Francisco de la Cerda y Aragón has been Viceroy of Naples since 1696, first for King Charles II of Spain."
de = "Luis Francisco de la Cerda y Aragón ist seit 1696 Vizekönig von Neapel, zuerst für König Karl II. von Spanien."

