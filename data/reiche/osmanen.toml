# Osmanisches Reich (Eyalet Bosnien). Ersetzt das Sultanat der Aserai.
# Aufbau der Datei: siehe data/reiche/README.md

reich_id = "aserai"
kultur_id = "aserai"
kultur_wechseln = false
farben = ["FF9E1B1B", "FF1E6B3A"]
# Königreiche, mit denen das Reich zu Spielbeginn im Krieg ist (beide Seiten eintragen). Alle anderen Kriege
# dieses Reichs aus Calradia entfallen.
krieg_mit = ["vlandia", "empire_w"]
herrscher = "lord_3_1"

# Siedlungen, die die Kultur des Reichs bekommen (Städte und Burgen der Clans und ihre Dörfer)
siedlungen = []

name = { en = "Ottoman Empire", de = "Osmanisches Reich" }
kurzname = { en = "Ottomans", de = "Osmanen" }
titel = { en = "Eyalet of Bosnia", de = "Eyalet Bosnien" }
herrschertitel = { en = "Beylerbey", de = "Beylerbey" }

[text]
en = """
Bosnia is now the frontier province of the Ottoman Empire. Since the sack of Sarajevo the beylerbey sits in Travnik, and the captaincies along the Una, Sava and Drina guard the border against Habsburgs and Venetians.
"""
de = """
Bosnien ist jetzt die Grenzprovinz des Osmanischen Reichs. Seit dem Brand von Sarajevo sitzt der Beylerbey in Travnik, und die Kapetanije an Una, Save und Drina bewachen die Grenze gegen Habsburger und Venezianer.
"""

[herrscher_text]
en = "Mehmed governs the Eyalet of Bosnia in the name of the Sultan. Whether he keeps the post depends on Istanbul."
de = "Mehmed verwaltet das Eyalet Bosnien im Namen des Sultans. Ob er das Amt behält, entscheidet Istanbul."


# Wappen: weißes Zeichen der Aserai auf Rot.
# Zeichen und Farben sind Nummern aus Native/ModuleData/banner_icons.xml (Farbe: Nummer und Wert).
