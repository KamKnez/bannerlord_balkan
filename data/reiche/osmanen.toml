# Beschreibungen für die Enzyklopädie (Stand um 1700). Dörfer bekommen einen der dorftexte;
# {DORF} wird durch den Dorfnamen ersetzt, {SITZ} durch die Stadt oder Burg, zu der es gehört.
[ortstexte]
town_A1 = { en = "Sarajevo, founded by Isa-beg in the valley of the Miljacka, is the jewel of Bosnia, with the mosque, bazaar and baths of Gazi Husrev-beg. In 1697 Prince Eugene burned it, and its people are still rebuilding.", de = "Sarajevo, von Isa-beg im Tal der Miljacka gegründet, ist das Juwel Bosniens, mit Moschee, Basar und Bädern Gazi Husrev-begs. 1697 brannte Prinz Eugen die Stadt nieder, und ihre Bewohner bauen sie noch immer wieder auf." }
town_A2 = { en = "Belgrade's fortress stands where the Sava meets the Danube. It changed hands in 1688 and again in 1690, and it remains the gate of the Ottoman Balkans.", de = "Die Festung von Belgrad steht dort, wo die Save in die Donau mündet. Sie wechselte 1688 und erneut 1690 den Besitzer und bleibt das Tor des osmanischen Balkans." }
town_A6 = { en = "Banja Luka grew around the Ferhadija mosque of Ferhad Pasha. It guards the Vrbas valley and the northern border of the province.", de = "Banja Luka wuchs rund um die Ferhadija-Moschee Ferhad Paschas. Es bewacht das Tal des Vrbas und die Nordgrenze der Provinz." }
town_A7 = { en = "Mostar is the heart of Herzegovina. Its stone bridge, built in 1566, spans the green Neretva in a single bold arch.", de = "Mostar ist das Herz der Herzegowina. Seine 1566 erbaute Steinbrücke überspannt die grüne Neretva in einem einzigen kühnen Bogen." }
town_A8 = { en = "Travnik in the Lašva valley is to become the new seat of the vizier of Bosnia now that Sarajevo has burned. Until his konak is ready, the begs of the town keep it for him. Couriers, merchants and petitioners crowd its streets.", de = "Travnik im Tal der Lašva soll nach dem Brand von Sarajevo neuer Sitz des Wesirs von Bosnien werden. Bis sein Konak fertig ist, verwalten die Begs der Stadt sie für ihn. Kuriere, Kaufleute und Bittsteller füllen seine Gassen." }
castle_A1 = { en = "Bihać is the northwestern bulwark of the empire, taken in 1592. In 1697 it threw back a Habsburg siege, and its captains watch Croatia day and night.", de = "Bihać ist das nordwestliche Bollwerk des Reichs, 1592 erobert. 1697 schlug es eine habsburgische Belagerung ab, und seine Kapetane beobachten Kroatien Tag und Nacht." }
castle_A4 = { en = "Jajce, the old royal town of Bosnia, stands above the waterfall where the Pliva falls into the Vrbas.", de = "Jajce, die alte Königsstadt Bosniens, steht über dem Wasserfall, mit dem die Pliva in den Vrbas stürzt." }
town_A3 = { en = "Sofia is the seat of the beylerbey of Rumelia and lies on the great military road from Belgrade to Constantinople. Caravans, couriers and marching armies all pass beneath its minarets.", de = "Sofia ist der Sitz des Beylerbeys von Rumelien und liegt an der großen Heerstraße von Belgrad nach Konstantinopel. Karawanen, Kuriere und marschierende Heere ziehen unter seinen Minaretten vorbei." }
town_A4 = { en = "Saloniki is the great port of Macedonia. Its Sephardic Jews weave the blue cloth for the janissaries, and merchants from every shore of the sea trade on its quays.", de = "Saloniki ist der große Hafen Makedoniens. Seine sephardischen Juden weben das blaue Tuch für die Janitscharen, und Kaufleute von allen Küsten des Meeres handeln an seinen Kais." }
town_A5 = { en = "Edirne was the capital of the Ottomans before Constantinople, and the sultans still prefer to hold court and hunt here. Sinan's Selimiye mosque stands above the town, and the armies for the wars in the north gather on its plain.", de = "Edirne war die Hauptstadt der Osmanen vor Konstantinopel, und die Sultane halten noch immer am liebsten hier Hof und Jagd. Sinans Selimiye-Moschee steht über der Stadt, und auf der Ebene sammeln sich die Heere für die Kriege im Norden." }
castle_A2 = { en = "Novi Pazar is the market town where the caravan roads from Dubrovnik, Sarajevo and Skopje meet. It was burnt in the last war and is being rebuilt around its inns and its bazaar.", de = "Novi Pazar ist der Marktort, an dem sich die Karawanenwege aus Dubrovnik, Sarajevo und Skopje treffen. Im letzten Krieg wurde es niedergebrannt und wird nun rund um seine Herbergen und seinen Basar wieder aufgebaut." }
castle_A3 = { en = "Niš guards the military road where the routes to Sofia and to Salonica part. The imperial army took the town in 1689, and the Ottomans won it back a year later.", de = "Niš bewacht die Heerstraße dort, wo sich die Wege nach Sofia und nach Saloniki trennen. 1689 nahm das kaiserliche Heer die Stadt, ein Jahr später gewannen die Osmanen sie zurück." }
castle_A5 = { en = "Skopje on the Vardar was one of the richest towns of Rumelia until General Piccolomini had it set on fire in 1689. Much of it is still ash and rubble, and only the stone bridge and the fortress stand as before.", de = "Skopje am Vardar war eine der reichsten Städte Rumeliens, bis General Piccolomini es 1689 anzünden ließ. Vieles ist noch Asche und Schutt, nur die Steinbrücke und die Festung stehen wie zuvor." }
castle_A6 = { en = "Plowdiw, which the Ottomans call Filibe, lies on its hills above the Maritsa on the road to Constantinople. Rice from the river plain and the trade of the road have made its merchants wealthy.", de = "Plowdiw, das die Osmanen Filibe nennen, liegt auf seinen Hügeln über der Mariza an der Straße nach Konstantinopel. Der Reis aus der Flussebene und der Handel der Straße haben seine Kaufleute wohlhabend gemacht." }
castle_A7 = { en = "Tuzla takes its name from the Turkish word for salt. Brine has been boiled at its salt springs since ancient times, and the salt is carried all over Bosnia.", de = "Tuzla hat seinen Namen vom türkischen Wort für Salz. An seinen Salzquellen wird seit alter Zeit Sole gesotten, und das Salz geht in ganz Bosnien auf die Reise." }
castle_A8 = { en = "Vidin is a fortress on the Danube, built around the old castle of Baba Vida. The imperial army took it in 1689 and lost it again the next year, and since then the Ottomans have been strengthening its walls.", de = "Vidin ist eine Festung an der Donau, gewachsen um die alte Burg Baba Vida. Das kaiserliche Heer nahm sie 1689 und verlor sie im Jahr darauf wieder, und seither verstärken die Osmanen ihre Mauern." }
castle_A9 = { en = "Temeschwar is the seat of an Ottoman eyalet and lies among the marshes of the Bega. The Peace of Karlowitz left the Banat to the Sultan, and the fortress is now his foremost stronghold north of the Danube.", de = "Temeschwar ist Sitz eines osmanischen Eyalets und liegt mitten in den Sümpfen der Bega. Der Frieden von Karlowitz ließ das Banat beim Sultan, und die Festung ist nun sein vorderster Stützpunkt nördlich der Donau." }

[[dorftext]]
en = "{DORF} is a village near {SITZ}. Its fields belong to a timar, whose sipahi rides to war when the Sultan calls."
de = "{DORF} ist ein Dorf bei {SITZ}. Seine Felder gehören zu einem Timar, dessen Sipahi in den Krieg reitet, wenn der Sultan ruft."
[[dorftext]]
en = "{DORF} lies in the lands of {SITZ}. Muslim and Christian families live side by side here, and the bells and the call to prayer can both be heard."
de = "{DORF} liegt im Land von {SITZ}. Muslimische und christliche Familien leben hier Seite an Seite, und man hört sowohl die Glocken als auch den Gebetsruf."
[[dorftext]]
en = "{DORF} belongs to the district of {SITZ}. Its people keep orchards of plums and walnuts and sell cheese and wool at the town market."
de = "{DORF} gehört zum Bezirk von {SITZ}. Seine Bewohner pflegen Pflaumen- und Walnussgärten und verkaufen Käse und Wolle auf dem Markt der Stadt."

