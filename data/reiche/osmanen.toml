# Beschreibungen für die Enzyklopädie (Stand um 1700). Dörfer bekommen einen der dorftexte;
# {DORF} wird durch den Dorfnamen ersetzt, {SITZ} durch die Stadt oder Burg, zu der es gehört.
[ortstexte]
town_A1 = { en = "Sarajevo, founded by Isa-beg in the valley of the Miljacka, is the jewel of Bosnia, with the mosque, bazaar and baths of Gazi Husrev-beg. In 1697 Prince Eugene burned it, and its people are still rebuilding.", de = "Sarajevo, von Isa-beg im Tal der Miljacka gegründet, ist das Juwel Bosniens, mit Moschee, Basar und Bädern Gazi Husrev-begs. 1697 brannte Prinz Eugen die Stadt nieder, und ihre Bewohner bauen sie noch immer wieder auf." }
town_A2 = { en = "Belgrade's fortress stands where the Sava meets the Danube. It changed hands in 1688 and again in 1690, and it remains the gate of the Ottoman Balkans.", de = "Die Festung von Belgrad steht dort, wo die Save in die Donau mündet. Sie wechselte 1688 und erneut 1690 den Besitzer und bleibt das Tor des osmanischen Balkans." }
town_A6 = { en = "Banja Luka grew around the Ferhadija mosque of Ferhad Pasha. It guards the Vrbas valley and the northern border of the province.", de = "Banja Luka wuchs rund um die Ferhadija-Moschee Ferhad Paschas. Es bewacht das Tal des Vrbas und die Nordgrenze der Provinz." }
town_A7 = { en = "Mostar is the heart of Herzegovina. Its stone bridge, built in 1566, spans the green Neretva in a single bold arch.", de = "Mostar ist das Herz der Herzegowina. Seine 1566 erbaute Steinbrücke überspannt die grüne Neretva in einem einzigen kühnen Bogen." }
town_A8 = { en = "Travnik in the Lašva valley is to become the new seat of the vizier of Bosnia now that Sarajevo has burned. Until his konak is ready, the begs of the town keep it for him. Couriers, merchants and petitioners crowd its streets.", de = "Travnik im Tal der Lašva soll nach dem Brand von Sarajevo neuer Sitz des Wesirs von Bosnien werden. Bis sein Konak fertig ist, verwalten die Begs der Stadt sie für ihn. Kuriere, Kaufleute und Bittsteller füllen seine Gassen." }
castle_A1 = { en = "Bihać is the northwestern bulwark of the empire, taken in 1592. In 1697 it threw back a Habsburg siege, and its captains watch Croatia day and night.", de = "Bihać ist das nordwestliche Bollwerk des Reichs, 1592 erobert. 1697 schlug es eine habsburgische Belagerung ab, und seine Kapetane beobachten Kroatien Tag und Nacht." }
castle_A4 = { en = "Jajce, the old royal town of Bosnia, stands above the waterfall where the Pliva falls into the Vrbas.", de = "Jajce, die alte Königsstadt Bosniens, steht über dem Wasserfall, mit dem die Pliva in den Vrbas stürzt." }
town_A3 = { en = "Sofia has been the capital of the Rumelia Eyalet since 1530. Three mountain passes lead to the city, and they have been key roads since antiquity.", de = "Sofia ist seit 1530 die Hauptstadt des Eyalets Rumelien. Drei Gebirgspässe führen zur Stadt, sie sind seit der Antike wichtige Straßen." }
town_A4 = { en = "In Saloniki the Jews are the majority. In 1613 they made up 68 per cent of the population. A sultan chose the Jews of the city to be the exclusive makers of the uniforms of the janissaries.", de = "In Saloniki stellen die Juden die Mehrheit. 1613 waren sie 68 Prozent der Bevölkerung. Ein Sultan bestimmte die Juden der Stadt zu den alleinigen Herstellern der Uniformen der Janitscharen." }
town_A5 = { en = "Edirne was the capital of the Ottoman Empire from the 1360s until 1453. The Selimiye Mosque, designed by Mimar Sinan and built in 1575, stands here. Sultan Mehmed IV, called the Hunter, withdrew to Edirne after he was deposed and died here in 1693.", de = "Edirne war von den 1360er Jahren bis 1453 die Hauptstadt des Osmanischen Reichs. Hier steht die Selimiye-Moschee, entworfen von Mimar Sinan und 1575 erbaut. Sultan Mehmed IV., genannt der Jäger, zog sich nach seiner Absetzung nach Edirne zurück und starb hier 1693." }
castle_A2 = { en = "Novi Pazar became a rich market town at the crossroads of the routes from Dubrovnik, Niš, Sofia, Istanbul, Salonica, Sarajevo and Belgrade. The Austrian army captured it at the end of 1689, before the Ottomans won the region back.", de = "Novi Pazar wurde als Marktstadt an der Kreuzung der Wege aus Dubrovnik, Niš, Sofia, Istanbul, Saloniki, Sarajevo und Belgrad reich. Ende 1689 nahm das österreichische Heer die Stadt ein, ehe die Osmanen die Gegend zurückgewannen." }
castle_A3 = { en = "The Austrian army took Niš in 1689 after defeating the Ottomans in the battle of Niš on 24 September. The Ottomans retook the town the following year, after the Austrians had abandoned it.", de = "Das österreichische Heer nahm Niš 1689 ein, nachdem es die Osmanen am 24. September in der Schlacht bei Niš geschlagen hatte. Im Jahr darauf gewannen die Osmanen die Stadt zurück, nachdem die Österreicher sie aufgegeben hatten." }
castle_A5 = { en = "On the order of General Piccolomini, Skopje was set on fire in October 1689. Only stone buildings such as the fortress and some churches and mosques remained relatively undamaged. The population fell from about 60,000 to about 10,000, and the town lost its importance as a trading centre.", de = "Auf Befehl von General Piccolomini wurde Skopje im Oktober 1689 in Brand gesteckt. Nur Steinbauten wie die Festung und einige Kirchen und Moscheen blieben einigermaßen unversehrt. Die Bevölkerung sank von rund 60.000 auf rund 10.000, und die Stadt verlor ihre Bedeutung als Handelsplatz." }
castle_A6 = { en = "Plowdiw, which the Ottomans call Filibe, has grown on seven hills on both banks of the Maritsa. It is one of the important nodes of trade and transport in the Ottoman Balkans.", de = "Plowdiw, das die Osmanen Filibe nennen, ist auf sieben Hügeln an beiden Ufern der Mariza gewachsen. Es ist einer der wichtigen Knoten für Handel und Verkehr auf dem osmanischen Balkan." }
castle_A7 = { en = "Tuzla takes its name from tuzla, the Ottoman Turkish word for a salt mine. In the Middle Ages the place was called Soli, which means salts. Its salt deposits are mined for export and are a large source of tax revenue for the Ottomans.", de = "Tuzla hat seinen Namen von tuzla, dem osmanisch-türkischen Wort für ein Salzbergwerk. Im Mittelalter hieß der Ort Soli, das bedeutet Salze. Seine Salzvorkommen werden für die Ausfuhr abgebaut und bringen den Osmanen hohe Steuereinnahmen." }
castle_A8 = { en = "Vidin with its fortress Baba Vida fell under Austrian occupation in October 1689. The occupation lasted nine months and ended in August 1690. The Ottomans use Baba Vida as a weapon store and a prison.", de = "Vidin mit seiner Festung Baba Vida fiel im Oktober 1689 unter österreichische Besatzung. Sie dauerte neun Monate und endete im August 1690. Die Osmanen nutzen Baba Vida als Waffenlager und Gefängnis." }
castle_A9 = { en = "Temeschwar is the administrative centre of the Ottoman province of Temeşvar. Its fortress was raised on swampy land near the Bega and is protected by water trenches around the walls. An imperial siege in 1696 failed, and the Peace of Karlowitz of 1699 left the province with the Ottomans.", de = "Temeschwar ist der Verwaltungssitz der osmanischen Provinz Temeşvar. Seine Festung wurde auf sumpfigem Land nahe der Bega errichtet und ist durch Wassergräben rund um die Mauern geschützt. Eine kaiserliche Belagerung scheiterte 1696, und der Frieden von Karlowitz 1699 beließ die Provinz bei den Osmanen." }

[[dorftext]]
en = "{DORF} is a village near {SITZ}. Its fields belong to a timar, whose sipahi rides to war when the Sultan calls."
de = "{DORF} ist ein Dorf bei {SITZ}. Seine Felder gehören zu einem Timar, dessen Sipahi in den Krieg reitet, wenn der Sultan ruft."
[[dorftext]]
en = "{DORF} lies in the lands of {SITZ}. Muslim and Christian families live side by side here, and the bells and the call to prayer can both be heard."
de = "{DORF} liegt im Land von {SITZ}. Muslimische und christliche Familien leben hier Seite an Seite, und man hört sowohl die Glocken als auch den Gebetsruf."
[[dorftext]]
en = "{DORF} belongs to the district of {SITZ}. Its people keep orchards of plums and walnuts and sell cheese and wool at the town market."
de = "{DORF} gehört zum Bezirk von {SITZ}. Seine Bewohner pflegen Pflaumen- und Walnussgärten und verkaufen Käse und Wolle auf dem Markt der Stadt."

