# Osmanisches Reich (Eyalet Bosnien). Ersetzt das Sultanat der Aserai.
# Aufbau der Datei: siehe data/reiche/README.md

reich_id = "aserai"
kultur_id = "aserai"
kultur_wechseln = false
farben = ["FF9E1B1B", "FF1E6B3A"]
# Königreiche, mit denen das Reich zu Spielbeginn im Krieg ist (beide Seiten eintragen). Alle anderen Kriege
# dieses Reichs aus Calradia entfallen.
krieg_mit = ["vlandia", "empire_w"]
herrscher = "lord_3_1"

# Siedlungen, die die Kultur des Reichs bekommen (Städte und Burgen der Clans und ihre Dörfer)
siedlungen = []

name = { en = "Ottoman Empire", de = "Osmanisches Reich" }
kurzname = { en = "Ottomans", de = "Osmanen" }
titel = { en = "Eyalet of Bosnia", de = "Eyalet Bosnien" }
herrschertitel = { en = "Beylerbey", de = "Beylerbey" }

[text]
en = """
After the Peace of Karlowitz Bosnia is the frontier province of the Ottoman Empire. Sarajevo was burned in the war, so the pasha's seat is moving to Travnik. Twelve captaincies, most of them along the border, guard it against Habsburgs and Venetians.
"""
de = """
Nach dem Frieden von Karlowitz ist Bosnien die Grenzprovinz des Osmanischen Reichs. Sarajevo ist im Krieg niedergebrannt, deshalb zieht der Sitz des Paschas nach Travnik. Zwölf Kapetanije, die meisten an der Grenze, bewachen sie gegen Habsburger und Venezianer.
"""

[herrscher_text]
en = "Halil Pasha, called Köse, governs the Eyalet of Bosnia in the name of the Sultan. Whether he keeps the post depends on Istanbul."
de = "Halil Pascha, genannt Köse, verwaltet das Eyalet Bosnien im Namen des Sultans. Ob er das Amt behält, entscheidet Istanbul."


