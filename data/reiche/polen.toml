# Polen-Litauen. Ersetzt Sturgia.
# Quellen: https://en.wikipedia.org/wiki/Polish%E2%80%93Lithuanian_Commonwealth (Wahlmonarchie, Friedrich August 1697
# gewählt und als August II. gekrönt), https://en.wikipedia.org/wiki/Magnates_of_Poland_and_Lithuania (Magnatenfamilien
# Czartoryski, Potocki, Wiśniowiecki, Zamoyski, Radziwiłł, Pac, Sapieha, Koniecpolski; Litauischer Bürgerkrieg 1700
# um die Sapieha). Die Vornamen der Lords sind reihum aus data/namen/polen.txt verteilt.
# Aufbau der Datei: siehe data/reiche/README.md

reich_id = "sturgia"
kultur_id = "sturgia"
kultur_wechseln = false
farben = ["FFDC143C", "FFF4F1EA"]
herrscher = "lord_2_1"
siedlungen = []

name = { en = "Polish–Lithuanian Commonwealth", de = "Polen-Litauen" }
kurzname = { en = "Poles", de = "Polen" }
titel = { en = "Commonwealth of the Two Nations", de = "Republik beider Völker" }
herrschertitel = { en = "King", de = "König" }

[text]
en = """
The Commonwealth of Poland and Lithuania is an elective monarchy: its nobles elect the king for life and guard their Golden Liberty. Since the second half of the 17th century the great magnate families hold the real power, and in 1700 the Sapieha fight the other Lithuanian nobles in open civil war.
"""
de = """
Polen-Litauen ist eine Wahlmonarchie: Der Adel wählt den König auf Lebenszeit und wacht über seine Goldene Freiheit. Seit der zweiten Hälfte des 17. Jahrhunderts haben die großen Magnatenfamilien die eigentliche Macht, und 1700 kämpfen die Sapieha in offenem Bürgerkrieg gegen den übrigen litauischen Adel.
"""

[herrscher_text]
en = "Frederick Augustus of Saxony was elected King of Poland in June 1697 and crowned as Augustus II in September."
de = "Friedrich August von Sachsen wurde im Juni 1697 zum König von Polen gewählt und im September als August II. gekrönt."

