# Lebensläufe der Bulgaren (Vorlage Sturgia). Aufbau: siehe README.md
# Quellen (Wikipedia, en): Voynuks (Ränge, Pferde und Transport für Feldzüge), Hajduk (bulgarische Hajduken),
# Chiprovtsi_uprising und Chiprovtsi (Gold- und Silberschmiede, Stadt 1688 niedergebrannt), Ottoman_Bulgaria (seit 1396).
[sturgia_companion_option]
titel = { en = "A çeribaşı's household", de = "das Haus eines Çeribaşı" }
text = { en = "Your father belonged to the household of a voynuk çeribaşı. The voynuks were Christians who served the Sultan in return for freedom from taxes. When the army marched, they brought horses and carried its baggage, and your father rode with them.", de = "Euer Vater gehörte zum Haus eines Woinuken-Çeribaşı. Die Woinuken waren Christen, die dem Sultan dienten und dafür keine Steuern zahlten. Wenn das Heer auszog, brachten sie Pferde und trugen den Tross, und Euer Vater ritt mit ihnen." }

[sturgia_trader_option]
titel = { en = "Travelling traders", de = "fahrende Händler" }
text = { en = "Your family were traders who drove their pack animals from market to market. They knew the roads and the inns and which official had to be paid along the way.", de = "Eure Familie waren Händler, die mit ihren Packtieren von Markt zu Markt zogen. Sie kannten die Straßen und Herbergen und wussten, welcher Beamte unterwegs bezahlt werden wollte." }

[sturgia_farmer_option]
titel = { en = "Christian farmers", de = "christliche Bauern" }
text = { en = "Your family farmed a small plot in the valley. They paid their dues to the sipahi and the head tax that Christians owed the Sultan, and had just enough left to live on.", de = "Eure Familie bestellte ein kleines Stück Land im Tal. Sie zahlten ihre Abgaben an den Sipahi und die Kopfsteuer, die Christen dem Sultan schuldeten, und behielten gerade genug zum Leben." }

[sturgia_artisan_option]
titel = { en = "Goldsmiths of Chiprovtsi", de = "Goldschmiede aus Tschiprowzi" }
text = { en = "Your family were gold- and silversmiths in Chiprovtsi, the Catholic town in the northwest. When the uprising of 1688 failed and the town was burned, they fled with what they could carry and started again elsewhere.", de = "Eure Familie waren Gold- und Silberschmiede in Tschiprowzi, der katholischen Stadt im Nordwesten. Als der Aufstand von 1688 scheiterte und die Stadt niedergebrannt wurde, flohen sie mit dem, was sie tragen konnten, und begannen anderswo neu." }

[sturgia_hunter_option]
titel = { en = "Mountain folk", de = "Bergleute" }
text = { en = "Your family lived in a village high in the mountains, far from the officials of the plain. They kept goats, hunted in the forests and guided travellers over the passes.", de = "Eure Familie lebte in einem Dorf hoch in den Bergen, weit weg von den Beamten der Ebene. Sie hielten Ziegen, jagten in den Wäldern und führten Reisende über die Pässe." }

[sturgia_vagabond_option]
titel = { en = "Friends of the hajduks", de = "Freunde der Hajduken" }
text = { en = "Your family were poor and owned nothing but debts. They carried bread and news to the hajduks in the forests and sold what the hajduks took from the tax collectors. You learned early whom to trust and whom to fear.", de = "Eure Familie war arm und besaß nichts außer Schulden. Sie brachten den Hajduken in den Wäldern Brot und Nachrichten und verkauften, was die Hajduken den Steuereintreibern abnahmen. Ihr habt früh gelernt, wem man trauen kann und wen man fürchten muss." }
