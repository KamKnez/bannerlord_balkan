# Historische Ereignisse der Sandbox „Zwischen den Kriegen“ (docs/szenarien.md).
# Jedes Ereignis tritt einmal ein, sobald sein Datum erreicht ist. Abschaltbar im MCM-Menü (Balkan 1700 → Ereignisse).
#
# jahr, tag    Datum in den Jahren der Mod; das Jahr des Spiels hat 84 Tage (4 Jahreszeiten zu 21 Tagen,
#              Frühling 1–21, Sommer 22–42, Herbst 43–63, Winter 64–84)
# titel, text  Fenster beim Eintreten, Englisch und Deutsch
# aktionen     art = "krieg" | "frieden" | "buendnis", reiche = zwei Ids aus data/reiche/ (reich_id)
#              Eine Aktion entfällt, wenn sie schon gilt oder ein Reich nicht mehr besteht.

[[ereignis]]
id = "karlowitz_1699"
jahr = 1700
tag = 1
titel = { en = "The Peace of Karlowitz", de = "Der Friede von Karlowitz" }
text = { en = "At Karlowitz the Sultan has made peace with the Emperor and with Venice. The Emperor keeps the bulk of Hungary, Venice keeps the Morea. The commissioners are still marking the Croatian and Bihać borders, but no one on the frontier believes the peace will last.", de = "In Karlowitz hat der Sultan Frieden mit dem Kaiser und mit Venedig geschlossen. Der Kaiser behält den größten Teil Ungarns, Venedig behält Morea. Die Kommissare stecken noch die Grenzen bei Kroatien und Bihać ab, doch niemand an der Grenze glaubt, dass der Frieden hält." }
aktionen = [
    { art = "frieden", reiche = ["aserai", "vlandia"] },
    { art = "frieden", reiche = ["aserai", "empire_w"] },
]

[[ereignis]]
id = "venedig_krieg_1714"
jahr = 1714
tag = 80
titel = { en = "The Sultan declares war on Venice", de = "Der Sultan erklärt Venedig den Krieg" }
text = { en = "The Porte wants Morea back. On 9 December 1714 the Sultan declared war on the Republic. Grand Vizier Silahdar Damat Ali Pasha leads the army to the Morea, and the pasha of Bosnia is gathering men against Dalmatia.", de = "Die Pforte will Morea zurück. Am 9. Dezember 1714 hat der Sultan der Republik den Krieg erklärt. Großwesir Silahdar Damat Ali Pascha führt das Heer nach Morea, und der Pascha von Bosnien sammelt Männer gegen Dalmatien." }
aktionen = [
    { art = "krieg", reiche = ["aserai", "empire_w"] },
]

[[ereignis]]
id = "habsburg_krieg_1716"
jahr = 1716
tag = 28
titel = { en = "The Emperor joins the war", de = "Der Kaiser tritt in den Krieg ein" }
text = { en = "On 13 April 1716 Emperor Charles VI renewed his alliance with Venice, and the Sultan declared war on him. Prince Eugene of Savoy leads the imperial army against the Ottomans.", de = "Am 13. April 1716 hat Kaiser Karl VI. sein Bündnis mit Venedig erneuert, und der Sultan hat ihm den Krieg erklärt. Prinz Eugen von Savoyen führt das kaiserliche Heer gegen die Osmanen." }
aktionen = [
    { art = "buendnis", reiche = ["vlandia", "empire_w"] },
    { art = "krieg", reiche = ["vlandia", "aserai"] },
]

[[ereignis]]
id = "passarowitz_1718"
jahr = 1718
tag = 45
titel = { en = "The Peace of Passarowitz", de = "Der Friede von Passarowitz" }
text = { en = "At Passarowitz the Emperor, Venice and the Sultan have made peace. The Emperor wins Belgrade and the Banat, Venice loses the Morea but gains Imotski and Vrgorac in Dalmatia. The frontier falls quiet again, for now.", de = "In Passarowitz haben der Kaiser, Venedig und der Sultan Frieden geschlossen. Der Kaiser gewinnt Belgrad und das Banat, Venedig verliert Morea, gewinnt aber Imotski und Vrgorac in Dalmatien. An der Grenze wird es wieder still, vorerst." }
aktionen = [
    { art = "frieden", reiche = ["vlandia", "aserai"] },
    { art = "frieden", reiche = ["empire_w", "aserai"] },
]
