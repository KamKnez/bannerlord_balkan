# Feuerwaffen und Munition (v0.1).
#
# Die Gewehre nutzen die Modelle und Animationen aus Napoleonic Warfare (newmusket, newrifle; siehe CREDITS.md und
# NICHT_FREIGEGEBEN.md). Sie sind mit dem Modding Kit gepackt (Module/BalkanMod/AssetPackages/pack0.tpac); die Lade-
# und Schussbewegungen stehen in ModuleData/action_*.xml, movement_sets.xml und item_usage_sets.xml. Die Pistole
# nutzt noch ein Armbrust-Modell, bis das NW-Pistolenmodell mitgepackt ist.
# Die Mechanik ist überall die der Armbrüste des Spiels (siehe docs/design.md, Abschnitt 6). Die Werte sind Richtwerte und werden nach
# Spieltests angepasst. Zum Vergleich die schwere Armbrust (crossbow_d) des Spiels:
# Schaden 93, Geschossgeschwindigkeit 90, Genauigkeit 99, Tempo 92, Handhabung 62.
# Feuerwaffen treffen härter als Armbrüste, laden aber langsamer und streuen mehr. Der Schaden liegt
# knapp darüber (90 bis 115 plus Kugel), damit nicht jeder Treffer auch schwer gepanzerte Truppen tötet.
#
# Felder einer Waffe:
#   id            Gegenstands-Id, beginnt mit "balkan_"
#   art           "gewehr" (zweihändig, nicht vom Pferd nachladbar), "pistole" oder "munition"
#   modell        Modell: Armbrust oder Bolzen aus dem Spiel, oder newmusket/newrifle aus Napoleonic Warfare
#   kultur        Kultur, in deren Städten die Waffe eher angeboten wird
#   gewicht       in kg
#   preis         Grundpreis in Denaren (ohne Angabe würde das Spiel ihn aus dem Schaden berechnen)
#   schaden       Stichschaden (Waffe) bzw. Zusatzschaden (Munition)
#   geschoss      Geschossgeschwindigkeit (nur Waffen)
#   genauigkeit   0 bis 100 (nur Waffen)
#   tempo         Schwunggeschwindigkeit, beeinflusst das Nachladen (nur Waffen)
#   handhabung    Handhabung (nur Waffen)
#   schwierigkeit benötigter Armbrust-Wert (nur Waffen)
#   anzahl        Schuss pro Beutel (nur Munition)
#
# Umstellen auf echte Modelle (z. B. aus einer Musketen-Mod als optionaler Abhängigkeit):
# Die Ids bleiben gleich, damit Truppen und Spielstände weiter passen. Es ändern sich nur
# modell (und bei Bedarf Kollisionskörper und Sitz der Munition in GUN_MODELS bzw. AMMO_MODELS
# in tools/gen_content.py) sowie gegebenenfalls Klang und Mechanik.
# Ausgabe: Module/BalkanMod/ModuleData/balkan_items.xml (über tools/gen_content.py)

