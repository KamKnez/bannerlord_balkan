# Kultur der Orte außerhalb unserer Reiche, wo die Bevölkerung um 1700 nicht zur Calradia-Kultur des Reichs passt.
# Sitz -> Kultur-Id aus data/kulturen; die Dörfer des Sitzes folgen ihm.
# Anatolien und Konstantinopel türkisch, Athen und Thessalien griechisch, Nordost-Bulgarien bulgarisch.
# Die ungarischen Städte und Burgen im Norden ungarisch, Hermannstadt (Sachsen in Siebenbürgen) deutsch.
[kultur]
