# Namen der Dörfer bei den Sitzen der Reiche, die (noch) keine eigene Datei in data/reiche/ haben.
# Die Sitze selbst heißen wie in orte.csv. Die Dörfer stehen automatisch rund um ihren Sitz, die Namen sind echte
# Orte aus der Umgebung, mit tools/weltkarte/dorfnamen_pruefen.py gegen Wikipedia geprüft
# (Ort vorhanden, Entfernung zum Sitz). Ergebnis je Dorf: data/weltkarte/dorfnamen_belege.csv.

# Der Ruhesitz des Spiels ("The Retreat", retirement_retreat): ein Ort ohne Objekt auf der Karte, an den sich die
# Spielfigur am Ende zurückzieht. Hier ist es das Felsenkloster Ostrog über dem Tal der Zeta, gegründet 1656.
# szene_vorbereiten.py schreibt die Lage in die Positions-XSLT, gen_content.py Name und Text.
[ruhesitz]
id = "retirement_retreat"
breite = 42.675
laenge = 19.029
name = { en = "Ostrog Monastery", de = "Kloster Ostrog" }
text = { en = "The monastery of Ostrog stands against an almost vertical wall, high up in the great rock of Ostroška Greda above the plain of the river Zeta. Vasilije, Metropolitan of Herzegovina, founded it in 1656 and died here in 1671. It is a meeting place of all confessions: Orthodox, Catholics and Muslims.", de = "Das Kloster Ostrog steht an einer fast senkrechten Wand, hoch oben im großen Felsen Ostroška Greda über der Ebene der Zeta. Vasilije, Metropolit der Herzegowina, gründete es 1656 und starb hier 1671. Es ist ein Treffpunkt aller Bekenntnisse: Orthodoxe, Katholiken und Muslime." }

