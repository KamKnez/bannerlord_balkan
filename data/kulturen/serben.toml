# Serben. Neue Kultur, kopiert alle übrigen Werte von Sturgia.
# Serbische Grenzer und Husaren dienten auf beiden Seiten der Grenze: bei den Habsburgern (nach der Großen
# Wanderung von 1690), bei Venedig (Morlaken) und unter den Osmanen.
# Rekrutierbar in Dörfern mit dieser Kultur (siehe [dorfkultur] in data/reiche/).
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "serben"
bild = "sturgia"  # Bild bei der Charaktererstellung (Kulturbild des Spiels)
kultur_id = "serbs"
art = "neu"
vorlage = "sturgia"
praefix = "sr"
namensliste = "serben"
farben = ["0xff8E1B1B", "0xff2F4F8F"]
gesicht = "fighter_sturgia"
zivil = ["sturgia_troop_civilian_template_t1", "sturgia_troop_civilian_template_t2", "sturgia_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "plemic"

[name]
en = "Serbs"
de = "Serben"

[text]
en = """
In 1690 Patriarch Arsenije III led more than 30,000 Serbs out of Belgrade into the Habsburg lands, and \
Emperor Leopold I granted them privileges. Like the other settlers of the Military Frontier, they receive land, \
freedom of religion and lower taxes, and in exchange they defend the border. Others stayed under the Sultan.
"""
de = """
1690 führte Patriarch Arsenije III. mehr als 30.000 Serben aus Belgrad in die habsburgischen Länder, und \
Kaiser Leopold I. gewährte ihnen Privilegien. Wie die anderen Siedler der Militärgrenze erhalten sie Land, \
Religionsfreiheit und niedrigere Steuern und verteidigen dafür die Grenze. Andere blieben unter dem Sultan.
"""

[miliz]
nahkampf = "militia_spearman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_spearman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
truppe = "peasant"
min = 4
max = 8

[[lord_partei]]
truppe = "shooter"
min = 3
max = 6

[[lord_partei]]
truppe = "musketeer"
min = 2
max = 4

[[lord_partei]]
truppe = "rider"
min = 1
max = 3

[[lord_partei]]
truppe = "hussar"
min = 0
max = 2

