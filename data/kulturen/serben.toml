# Serben. Neue Kultur, kopiert alle übrigen Werte von Sturgia.
# Serbische Grenzer und Husaren dienten auf beiden Seiten der Grenze: bei den Habsburgern (nach der Großen
# Wanderung von 1690), bei Venedig (Morlaken) und unter den Osmanen.
# Rekrutierbar in Dörfern mit dieser Kultur (siehe [dorfkultur] in data/reiche/).
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "serben"
kultur_id = "serbs"
art = "neu"
vorlage = "sturgia"
praefix = "sr"
namensliste = "serben"
farben = ["0xff8E1B1B", "0xff2F4F8F"]
gesicht = "fighter_sturgia"
zivil = ["sturgia_troop_civilian_template_t1", "sturgia_troop_civilian_template_t2", "sturgia_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "plemic"

[name]
en = "Serbs"
de = "Serben"

[text]
en = """
In 1690 tens of thousands of Serbs crossed the Sava and the Danube with their patriarch and settled on the \
Habsburg frontier, where they serve as border soldiers in return for land and freedom of faith. Others stayed \
under the Sultan or took service with Venice. Their hajduks and hussars are feared on every side of the border.
"""
de = """
1690 zogen Zehntausende Serben mit ihrem Patriarchen über Save und Donau und ließen sich an der habsburgischen \
Grenze nieder, wo sie für Land und Glaubensfreiheit als Grenzsoldaten dienen. Andere blieben unter dem Sultan \
oder traten in venezianische Dienste. Ihre Hajduken und Husaren sind auf allen Seiten der Grenze gefürchtet.
"""

[miliz]
nahkampf = "shooter"
fernkampf = "shooter"
nahkampf_elite = "musketeer"
fernkampf_elite = "hajduk"

[[lord_partei]]
truppe = "peasant"
min = 4
max = 8

[[lord_partei]]
truppe = "shooter"
min = 3
max = 6

[[lord_partei]]
truppe = "musketeer"
min = 2
max = 4

[[lord_partei]]
truppe = "rider"
min = 1
max = 3

[[lord_partei]]
truppe = "hussar"
min = 0
max = 2

