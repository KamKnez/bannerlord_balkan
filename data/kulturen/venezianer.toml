# Venezianer (Republik Venedig). Neue Kultur, kopiert alle übrigen Werte vom Imperium.
# Die Truppen umfassen Italiener und Dalmatiner (Schiavoni, Oltremarini).
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "venezianer"
kultur_id = "venice"
art = "neu"
vorlage = "empire"
praefix = "ve"
namensliste = "italiener"
farben = ["0xff8C1C13", "0xffE8C547"]
gesicht = "fighter_empire"
zivil = ["empire_troop_civilian_template_t1", "empire_troop_civilian_template_t2", "empire_troop_civilian_template_t3"]
basis_truppe = "recruit"
elite_truppe = "gentiluomo"

[name]
en = "Venetians"
de = "Venezianer"

[text]
en = """
The Most Serene Republic of Venice rules the Adriatic from its lagoon. Along the Dalmatian coast its provveditori \
govern walled ports filled with merchants, sailors and soldiers. Italian pikemen and musketeers hold the walls, \
while Dalmatian schiavoni and Albanian cappelletti fight the war of raids in the hinterland.
"""
de = """
Die Durchlauchtigste Republik Venedig beherrscht die Adria von ihrer Lagune aus. An der dalmatinischen Küste \
verwalten ihre Provveditori ummauerte Häfen voller Kaufleute, Seeleute und Soldaten. Italienische Pikeniere und \
Musketiere halten die Mauern, dalmatinische Schiavoni und albanische Cappelletti führen den Kleinkrieg im Hinterland.
"""

[miliz]
nahkampf = "militia_pikeman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_pikeman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
truppe = "recruit"
min = 4
max = 8
[[lord_partei]]
truppe = "fante"
min = 2
max = 5
[[lord_partei]]
truppe = "picchiere"
min = 1
max = 3
[[lord_partei]]
truppe = "moschettiere"
min = 2
max = 4
[[lord_partei]]
truppe = "schiavone"
min = 2
max = 4
[[lord_partei]]
truppe = "cappelletto"
min = 1
max = 3
[[lord_partei]]
truppe = "cavaliere"
min = 1
max = 2
[[lord_partei]]
truppe = "corazza"
min = 0
max = 1

