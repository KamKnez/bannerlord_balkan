# Krimtataren (Krimkhanat). Ersetzt die Calradia-Kultur Khuzait. Einfacher erster Truppenbaum.
# Quellen (Wikipedia, geprüft):
#   https://en.wikipedia.org/wiki/Crimean_Khanate  Khane aus dem Haus Giray, Schutzstaat der Osmanen, Qaraçı Beys der
#     Clans Şirin, Barın, Arğın, Qıpçaq, darunter Mirzas; Nogai-Horden als Vasallen stellen einen großen Teil des
#     Heers; tscherkessische Söldner und Rekruten; Feldzüge (Sefer) unter dem Khan und Raubzüge (Çapul) des Adels;
#     Reiterei als Vorhut der osmanischen Feldzüge; Karlowitz 1699 verbietet weitere Raubzüge
#   https://en.wikipedia.org/wiki/Crimean_Tatars  Nogai ohne eigenen Khan, Vasallen der Krim
#   https://en.wikipedia.org/wiki/Lipka_Tatars  tatarische leichte Reiterei und Bogenschützen zu Pferd
# Waffen (Bogen, Säbel, Lanze) stehen auf diesen Seiten nicht im Einzelnen, Ausrüstung daher allgemein nach Steppenart.
# Die Ränge im Adelsbaum (Mirza vor Bey) folgen der Rangordnung auf der Seite, als Truppen sind sie eine Vereinfachung.
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "tataren"
bild = "khuzait"  # Bild bei der Charaktererstellung (Kulturbild des Spiels)
kultur_id = "khuzait"
art = "anpassen"
praefix = "kt"
namensliste = "tataren"
farben = ["0xff2B7A9E", "0xffE8C547"]
gesicht = "fighter_khuzait"
zivil = ["khuzait_troop_civilian_template_t1", "khuzait_troop_civilian_template_t2", "khuzait_troop_civilian_template_t3"]
basis_truppe = "herdsman"
elite_truppe = "mirza_retainer"

[name]
en = "Crimean Tatars"
de = "Krimtataren"

[text]
en = """
The Crimean Khanate is ruled by khans of the house of Giray, who govern together with the beys of the great clans \
Şirin, Barın, Arğın and Qıpçaq. The khanate stands under the protection of the Ottoman Sultan, who has appointed \
its khans since 1524, and its horsemen ride ahead of every Ottoman campaign. The Nogai hordes of the steppe serve the khan as \
vassals. For two centuries raids brought captives from Poland and Russia, until the Peace of Karlowitz in 1699 \
forbade them.
"""
de = """
Das Krimkhanat wird von Khanen aus dem Haus Giray regiert, die gemeinsam mit den Beys der großen Clans Şirin, Barın, \
Arğın und Qıpçaq herrschen. Das Khanat steht unter dem Schutz des osmanischen Sultans, der seit 1524 seine Khane \
ernennt, und seine Reiter ziehen jedem osmanischen Feldzug voraus. Die Nogai-Horden der Steppe dienen dem Khan als Vasallen. \
Zwei Jahrhunderte lang brachten Raubzüge Gefangene aus Polen und Russland, bis der Frieden von Karlowitz 1699 \
sie verbot.
"""

[miliz]
nahkampf = "militia_spearman"
fernkampf = "militia_archer"
nahkampf_elite = "militia_veteran_spearman"
fernkampf_elite = "militia_veteran_archer"

[[lord_partei]]
truppe = "herdsman"
min = 3
max = 6
[[lord_partei]]
truppe = "nogai_horseman"
min = 4
max = 8
[[lord_partei]]
truppe = "raider"
min = 2
max = 4
[[lord_partei]]
truppe = "circassian"
min = 1
max = 3
[[lord_partei]]
truppe = "mirza_retainer"
min = 1
max = 3
[[lord_partei]]
truppe = "mirza"
min = 0
max = 2

