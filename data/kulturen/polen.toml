# Polen (Polen-Litauen). Ersetzt die Calradia-Kultur Sturgia. Einfacher erster Truppenbaum.
# Quellen (Wikipedia, geprüft):
#   https://en.wikipedia.org/wiki/Military_of_the_Polish%E2%80%93Lithuanian_Commonwealth  Wybraniecka-Infanterie
#     (Bauernaufgebot der Krongüter), Infanterie nach fremder Art, Dragoner, Reform Sobieskis in den 1670ern,
#     Husarenbanner der königlichen Garde
#   https://en.wikipedia.org/wiki/Polish_hussars  Flügelhusaren aus dem wohlhabenden Adel, Towarzysz und Poczet,
#     Lanze, Koncerz, Säbel, Pistolen, Kürass; aktiv bis 1702, Wien 1683
#   https://en.wikipedia.org/wiki/Armoured_companion  Pancerni aus dem mittleren und niederen Adel, Kettenhemd,
#     Säbel, Bogen, Pistolen, Karabiner
#   https://en.wikipedia.org/wiki/Polish%E2%80%93Lithuanian_Commonwealth  Wahlkönigtum des Adels
#   https://en.wikipedia.org/wiki/Battle_of_Vienna  Entsatz Wiens 1683 unter Jan III. Sobieski
#   https://en.wikipedia.org/wiki/Haiduc  Hajduken als polnische Infanterie mit Luntenschloss und schwerem Säbel,
#     später vor allem als Leibwache der Hetmane
# Die Ränge im Adelsbaum (Gefolgsmann vor Kamerad, Pancerni vor Husaren) sind eine Spielvereinfachung.
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "polen"
bild = "sturgia"  # Bild bei der Charaktererstellung (Kulturbild des Spiels)
kultur_id = "sturgia"
art = "anpassen"
praefix = "pl"
namensliste = "polen"
farben = ["0xffDC143C", "0xffF4F1EA"]
gesicht = "fighter_sturgia"
zivil = ["sturgia_troop_civilian_template_t1", "sturgia_troop_civilian_template_t2", "sturgia_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "pancerny_retainer"

[name]
en = "Poles"
de = "Polen"

[text]
en = """
The Polish–Lithuanian Commonwealth is a union of nobles who elect their king. In 1683 King Jan III Sobieski \
led the relief of Vienna, and his winged hussars, the pride of the wealthy nobility, rode in the great charge. \
Lesser nobles serve as armoured companions in mail with sabre and bow, while the infantry is now raised in the \
foreign style, with muskets and dragoons.
"""
de = """
Polen-Litauen ist ein Bund von Adligen, die ihren König wählen. 1683 führte König Jan III. Sobieski das \
Entsatzheer vor Wien, und seine Flügelhusaren, der Stolz des reichen Adels, ritten im großen Angriff mit. \
Der niedere Adel dient als gepanzerte Kameraden in Kettenhemd mit Säbel und Bogen, die Infanterie wird nun \
nach fremder Art mit Musketen und als Dragoner aufgestellt.
"""

[miliz]
nahkampf = "militia_spearman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_spearman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
