# Italiener (Kirchenstaat und spanisches Königreich Neapel). Ersetzt die Calradia-Kultur Battania.
# Einfacher erster Truppenbaum.
# Quellen (Wikipedia, geprüft):
#   https://en.wikipedia.org/wiki/Tercio  Tercios von Neapel und Sizilien seit 1536, von Lombardei; Kompanie aus
#     Piqueros, Arcabuceros (später Musketiere) und Coseletes; Ränge Maestre de Campo, Sargento mayor, Capitán,
#     Alférez, Sargento, Cabo de escuadra, Abanderado; ab Mitte des 17. Jh. von Adligen auf eigene Kosten
#     aufgestellt; 1704 in Regimenter umgewandelt
#   https://en.wikipedia.org/wiki/Corsican_Guard  Korsische Garde des Papstes (1603 bis 1662/64) und die Corazze,
#     ein päpstliches Korps fast ganz aus Bologna (belegt 1642)
#   https://en.wikipedia.org/wiki/Papal_Army  Kirchenstaat in seiner größten Ausdehnung seit 1649 (Castro)
# Die Ränge im Adelsbaum als berittene Truppen sind eine Spielvereinfachung.
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "italiener"
bild = "empire"  # Bild bei der Charaktererstellung (Kulturbild des Spiels)
kultur_id = "battania"
art = "anpassen"
praefix = "it"
namensliste = "italiener"
farben = ["0xffF2C230", "0xffFFFFFF"]
gesicht = "fighter_empire"
zivil = ["empire_troop_civilian_template_t1", "empire_troop_civilian_template_t2", "empire_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "abanderado"

[name]
en = "Italians"
de = "Italiener"

[text]
en = """
Italy south of Venice is divided between the Pope and the Spanish crown. The Papal States reached their greatest \
extent in 1649, while Naples and Sicily send their own tercios of pikemen and musketeers into the King of Spain's \
wars. Since the middle of the century nobles raise these tercios at their own expense, and the Pope keeps \
cuirassiers recruited in Bologna.
"""
de = """
Italien südlich von Venedig ist zwischen dem Papst und der spanischen Krone geteilt. Der Kirchenstaat erreichte \
1649 seine größte Ausdehnung, Neapel und Sizilien schicken eigene Tercios aus Pikenieren und Musketieren in die \
Kriege des spanischen Königs. Seit der Mitte des Jahrhunderts stellen Adlige diese Tercios auf eigene Kosten auf, \
und der Papst unterhält Kürassiere aus Bologna.
"""

[miliz]
nahkampf = "militia_pikeman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_pikeman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
truppe = "peasant"
min = 4
max = 8
[[lord_partei]]
truppe = "piquero"
min = 3
max = 6
[[lord_partei]]
truppe = "arcabucero"
min = 3
max = 6
[[lord_partei]]
truppe = "mosquetero"
min = 1
max = 3
[[lord_partei]]
truppe = "abanderado"
min = 1
max = 2
[[lord_partei]]
truppe = "corazza"
min = 0
max = 2

