# Kroaten (Habsburgermonarchie). Ersetzt die Calradia-Kultur Vlandia.
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "kroaten"
kultur_id = "vlandia"
art = "anpassen"
praefix = "hr"
namensliste = "kroaten"
farben = ["0xffB0182A", "0xffF2EFE6"]
gesicht = "fighter_vlandia"
zivil = ["vlandia_troop_civilian_template_t1", "vlandia_troop_civilian_template_t2", "vlandia_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "junker"

[name]
en = "Croatians"
de = "Kroaten"

[text]
en = """
Croatia, Slavonia and Dalmatia call themselves a kingdom of their own, joined to the Habsburg crown. \
For two centuries the Croats have held the Military Frontier against the Ottomans: free peasants owe the emperor \
service instead of rent, and every village keeps its haramije and horsemen ready. Their nobles still ride as \
armoured cavalry, while the border men fight with sabre and arquebus.
"""
de = """
Kroatien, Slawonien und Dalmatien nennen sich ein eigenes Königreich unter der habsburgischen Krone. \
Seit zwei Jahrhunderten halten die Kroaten die Militärgrenze gegen die Osmanen: Freie Bauern leisten dem Kaiser \
Kriegsdienst statt Abgaben, und jedes Dorf hält seine Haramije und Reiter bereit. Der Adel reitet noch als \
gepanzerte Reiterei, die Grenzer kämpfen mit Säbel und Arkebuse.
"""

[miliz]
nahkampf = "militia_spearman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_spearman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
