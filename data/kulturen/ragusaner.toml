# Ragusaner (Republik Ragusa). Neue Kultur, kopiert alle übrigen Werte vom Imperium.
# Ragusa hat kaum ein eigenes Heer: Stadtwache, Hellebardiere, Arkebusiere und eine Garde des Rektors.
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "ragusaner"
kultur_id = "ragusa"
art = "neu"
vorlage = "empire"
praefix = "ra"
namensliste = "ragusaner"
farben = ["0xffF2EFE6", "0xff1F3E8C"]
gesicht = "fighter_empire"
zivil = ["empire_troop_civilian_template_t1", "empire_troop_civilian_template_t2", "empire_troop_civilian_template_t3"]
basis_truppe = "recruit"
elite_truppe = "patrician"

[name]
en = "Ragusans"
de = "Ragusaner"

[text]
en = """
The Republic of Ragusa keeps its freedom with gold rather than steel. Its merchant fleet trades from the Levant \
to Spain, and every year its envoys carry tribute to the Sultan. Behind the great walls of the city a small guard \
of halberdiers and arquebusiers serves the Rector, who changes every month so that no man may rule alone.
"""
de = """
Die Republik Ragusa wahrt ihre Freiheit eher mit Gold als mit Stahl. Ihre Handelsflotte fährt von der Levante \
bis Spanien, und jedes Jahr bringen ihre Gesandten dem Sultan den Tribut. Hinter den großen Mauern der Stadt dient \
eine kleine Wache aus Hellebardieren und Arkebusieren dem Rektor, der jeden Monat wechselt, damit keiner allein herrscht.
"""

[miliz]
nahkampf = "militia_halberdier"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_halberdier"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
truppe = "recruit"
min = 4
max = 8
[[lord_partei]]
truppe = "city_guard"
min = 3
max = 6
[[lord_partei]]
truppe = "halberdier"
min = 1
max = 3
[[lord_partei]]
truppe = "arquebusier"
min = 2
max = 4
[[lord_partei]]
truppe = "patrician_rider"
min = 1
max = 2

