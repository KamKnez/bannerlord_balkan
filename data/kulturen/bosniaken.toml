# Bosniaken (Osmanisches Reich). Ersetzt die Calradia-Kultur Aserai.
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "bosniaken"
bild = "battania"  # Bild bei der Charaktererstellung (Kulturbild des Spiels)
kultur_id = "aserai"
art = "anpassen"
praefix = "bs"
namensliste = "bosniaken"
farben = ["0xff1E6B3A", "0xffE3B04B"]
# Bosniaken sind Südslawen: Gesichter der Imperialen statt der Aserai
gesicht = "fighter_empire"
# Alltagskleidung osmanisch (Turban, Kaftan) wie bei den Türken
zivil = ["aserai_troop_civilian_template_t1", "aserai_troop_civilian_template_t2", "aserai_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "timarli_sipahi"

[name]
en = "Bosniaks"
de = "Bosniaken"

[text]
en = """
The Eyalet of Bosnia is the Ottoman bulwark on the Habsburg and Venetian frontier. \
Its captaincies, the kapetanije, guard the river crossings and mountain passes, manned by azaps and musketeers \
who know every ford. The sipahis hold their timars in return for service on horseback, and the reckless deli \
horsemen ride ahead of every raid.
"""
de = """
Das Eyalet Bosnien ist das osmanische Bollwerk an der Grenze zu den Habsburgern und zu Venedig. \
Seine Kapetanije bewachen Flussübergänge und Gebirgspässe, besetzt mit Azapen und Musketieren, die jede Furt kennen. \
Die Sipahi halten ihre Timare gegen Dienst zu Pferd, und die verwegenen Deli reiten jedem Streifzug voraus.
"""

[miliz]
nahkampf = "militia_spearman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_spearman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
truppe = "peasant"
min = 4
max = 8
[[lord_partei]]
truppe = "azap"
min = 3
max = 6
[[lord_partei]]
truppe = "tufekci"
min = 2
max = 4
[[lord_partei]]
truppe = "kapetanije_marksman"
min = 0
max = 2
[[lord_partei]]
truppe = "deli"
min = 1
max = 3
[[lord_partei]]
truppe = "veteran_deli"
min = 0
max = 1
[[lord_partei]]
truppe = "sipahi"
min = 1
max = 3
[[lord_partei]]
truppe = "zaim"
min = 0
max = 1

