# Bulgaren (Osmanisches Reich). Neue Kultur, kopiert alle übrigen Werte von Sturgia.
# Christliche Untertanen des Sultans: Woinuken (christliche Hilfstruppen mit Steuerfreiheit), Derbendschi (Wächter
# der Gebirgspässe) und Hajduken in den Bergen. Einfacher erster Truppenbaum.
# Rekrutierbar in Dörfern mit dieser Kultur (siehe [dorfkultur] in data/reiche/).
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "bulgaren"
bild = "sturgia"  # Bild bei der Charaktererstellung (Kulturbild des Spiels)
kultur_id = "bulgarians"
art = "neu"
vorlage = "sturgia"
praefix = "bg"
namensliste = "bulgaren"
farben = ["0xff2E6B3A", "0xffE9E4D4"]
gesicht = "fighter_sturgia"
zivil = ["sturgia_troop_civilian_template_t1", "sturgia_troop_civilian_template_t2", "sturgia_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "konnik"

[name]
en = "Bulgarians"
de = "Bulgaren"

[text]
en = """
For three centuries the Bulgarians have lived under the Sultan, as farmers, herdsmen and craftsmen in the \
valleys of the Balkan mountains and on the Thracian plain. Some serve the empire as voynuks or as guards of the \
mountain passes and are freed from taxes in return. Others have taken to the forests as hajduks. The Catholic \
uprising of Chiprovtsi in 1688 was crushed, but it is not forgotten.
"""
de = """
Seit drei Jahrhunderten leben die Bulgaren unter dem Sultan, als Bauern, Hirten und Handwerker in den Tälern des \
Balkangebirges und in der thrakischen Ebene. Manche dienen dem Reich als Woinuken oder als Wächter der \
Gebirgspässe und sind dafür von Steuern befreit. Andere sind als Hajduken in die Wälder gegangen. Der katholische \
Aufstand von Tschiprowzi 1688 wurde niedergeschlagen, aber er ist nicht vergessen.
"""

[miliz]
nahkampf = "militia_spearman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_spearman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
truppe = "peasant"
min = 4
max = 8

[[lord_partei]]
truppe = "voynuk"
min = 3
max = 6

[[lord_partei]]
truppe = "derbendji"
min = 2
max = 4

[[lord_partei]]
truppe = "konnik"
min = 1
max = 2

