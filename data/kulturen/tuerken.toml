# Türken (Osmanisches Reich). Neue Kultur, kopiert alle übrigen Werte von den Aserai.
# Azapen, Sekbane und Janitscharen zu Fuß, Sipahi zu Pferd.
# Rekrutierbar in Dörfern mit dieser Kultur (siehe [dorfkultur] in data/reiche/).
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "tuerken"
kultur_id = "turks"
art = "neu"
vorlage = "aserai"
praefix = "tr"
namensliste = "tuerken"
farben = ["0xffB3141C", "0xffF4F1E8"]
gesicht = "fighter_aserai"
zivil = ["aserai_troop_civilian_template_t1", "aserai_troop_civilian_template_t2", "aserai_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "timarli_sipahi"

[name]
en = "Turks"
de = "Türken"

[text]
en = """
Turkish settlers, officials and soldiers have lived in the Balkan towns since the conquest. The Janissaries, \
the Sultan's standing infantry, are the most famous musketeers of the empire, while the sipahis hold their land \
in return for service on horseback.
"""
de = """
Türkische Siedler, Beamte und Soldaten leben seit der Eroberung in den Städten des Balkans. Die Janitscharen, \
das stehende Fußvolk des Sultans, sind die berühmtesten Musketiere des Reichs, während die Sipahi ihr Land für \
den Dienst zu Pferd erhalten.
"""

[miliz]
nahkampf = "militia_spearman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_spearman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
truppe = "peasant"
min = 4
max = 8

[[lord_partei]]
truppe = "azap"
min = 3
max = 6

[[lord_partei]]
truppe = "acemi"
min = 1
max = 3

[[lord_partei]]
truppe = "janissary"
min = 1
max = 3

[[lord_partei]]
truppe = "sekban"
min = 1
max = 3

[[lord_partei]]
truppe = "timarli_sipahi"
min = 1
max = 2

