# Ungarn (Habsburgermonarchie). Neue Kultur, kopiert alle übrigen Werte von Vlandia.
# Hajduken zu Fuß und Husaren zu Pferd.
# Rekrutierbar in Dörfern mit dieser Kultur (siehe [dorfkultur] in data/reiche/).
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "ungarn"
bild = "khuzait"  # Bild bei der Charaktererstellung (Kulturbild des Spiels)
kultur_id = "hungarians"
art = "neu"
vorlage = "vlandia"
praefix = "hu"
namensliste = "ungarn"
farben = ["0xff2E6B30", "0xffD8263A"]
gesicht = "fighter_vlandia"
zivil = ["vlandia_troop_civilian_template_t1", "vlandia_troop_civilian_template_t2", "vlandia_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "nemes"

[name]
en = "Hungarians"
de = "Ungarn"

[text]
en = """
After a century and a half of war the Hungarian plains are slowly filling with people again. The hajdús, once \
cattle drovers, fight on foot with musket and sabre, and the light hussars of the Hungarian nobility have become \
famous in every army of Europe.
"""
de = """
Nach anderthalb Jahrhunderten Krieg füllen sich die ungarischen Ebenen langsam wieder mit Menschen. Die Hajdúk, \
einst Viehtreiber, kämpfen zu Fuß mit Muskete und Säbel, und die leichten Husaren des ungarischen Adels sind in \
allen Heeren Europas berühmt geworden.
"""

[miliz]
nahkampf = "militia_spearman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_spearman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
truppe = "peasant"
min = 4
max = 8

[[lord_partei]]
truppe = "hajdu_recruit"
min = 3
max = 6

[[lord_partei]]
truppe = "hajdu"
min = 2
max = 4

[[lord_partei]]
truppe = "rider"
min = 1
max = 3

[[lord_partei]]
truppe = "hussar"
min = 1
max = 2

