# Griechen (Osmanisches Reich). Neue Kultur, kopiert alle übrigen Werte vom Imperium.
# Christliche Untertanen des Sultans: Armatolen (Bergmiliz im Auftrag der Osmanen, von den Einheimischen bezahlt),
# Seeleute der Inseln und Küsten, dazu die Kotzabasides (Gemeindevorsteher). Einfacher erster Truppenbaum.
# Quellen (Wikipedia, en): Armatoles (Ränge kapetanios, protopalikaro, palikaria; viele waren frühere Klephten),
# Klephts, Kodjabashis (christliche Notabeln = proestoi/prokritoi), Ottoman_Greece (Dimogerontes; Reeder als
# Seetransporteure des Reiches), Phanariots (1669-1821 Mehrheit der Dragomane), Greek_name (Heiligennamen).
# Der berittene Adelsbaum ist eine Spielvereinfachung: Stufe 2 und 3 tragen bewusst allgemeine Namen.
# Rekrutierbar in Dörfern mit dieser Kultur (siehe [dorfkultur] in data/reiche/).
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "griechen"
bild = "empire"  # Bild bei der Charaktererstellung (Kulturbild des Spiels)
kultur_id = "greeks"
art = "neu"
vorlage = "empire"
praefix = "gr"
namensliste = "griechen"
farben = ["0xff1F4E9A", "0xffF2F2F2"]
gesicht = "fighter_empire"
zivil = ["empire_troop_civilian_template_t1", "empire_troop_civilian_template_t2", "empire_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "notable_son"

[name]
en = "Greeks"
de = "Griechen"

[text]
en = """
The Greeks of Macedonia, Thessaly and the islands live under the Sultan as his Orthodox subjects. Greek ship \
owners carry much of the empire's trade by sea, and Phanariot families in Constantinople serve the Porte as \
dragomans, its interpreters. In the villages the kodjabashis speak for the community and collect the taxes. In the \
mountains the armatoles guard the passes on behalf of the Ottomans, while the klephts live as brigands; many \
armatoles were klephts before.
"""
de = """
Die Griechen Makedoniens, Thessaliens und der Inseln leben als orthodoxe Untertanen unter dem Sultan. Griechische \
Reeder befördern einen großen Teil des Seehandels des Reiches, und Phanarioten-Familien in Konstantinopel dienen \
der Pforte als Dragomane, ihre Dolmetscher. In den Dörfern vertreten die Kotzabasides die Gemeinde und treiben \
die Steuern ein. In den Bergen bewachen die Armatolen im Auftrag der Osmanen die Pässe, während die Klephten als \
Räuber leben; viele Armatolen waren vorher selbst Klephten.
"""

[miliz]
nahkampf = "militia_spearman"
fernkampf = "militia_shooter"
nahkampf_elite = "militia_veteran_spearman"
fernkampf_elite = "militia_veteran_shooter"

[[lord_partei]]
truppe = "peasant"
min = 4
max = 8

[[lord_partei]]
truppe = "armatolos"
min = 3
max = 6

[[lord_partei]]
truppe = "naftis"
min = 2
max = 4

[[lord_partei]]
truppe = "notable_son"
min = 1
max = 2

