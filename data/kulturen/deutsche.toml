# Deutsche (Habsburgermonarchie). Neue Kultur, kopiert alle übrigen Werte von Vlandia.
# Deutsche Kolonisten und Söldner: Pikeniere, Doppelsöldner, Musketiere und Kürassiere.
# Rekrutierbar in Dörfern mit dieser Kultur (siehe [dorfkultur] in data/reiche/).
# Aufbau der Datei: siehe data/kulturen/README.md

schluessel = "deutsche"
kultur_id = "germans"
art = "neu"
vorlage = "vlandia"
praefix = "de"
namensliste = "deutsche"
farben = ["0xff1A1A1A", "0xffE8C547"]
gesicht = "fighter_vlandia"
zivil = ["vlandia_troop_civilian_template_t1", "vlandia_troop_civilian_template_t2", "vlandia_troop_civilian_template_t3"]
basis_truppe = "peasant"
elite_truppe = "squire"

[name]
en = "Germans"
de = "Deutsche"

[text]
en = """
German settlers came to the frontier lands of Styria, Carniola and the reconquered plains as farmers, craftsmen \
and soldiers. The imperial regiments recruit their pikemen and musketeers among them, and the heavy cuirassiers \
of the Emperor are drawn from their nobility.
"""
de = """
Deutsche Siedler kamen als Bauern, Handwerker und Soldaten in die Grenzländer der Steiermark, Krains und der \
zurückeroberten Ebenen. Die kaiserlichen Regimenter werben unter ihnen Pikeniere und Musketiere, und aus ihrem \
Adel stammen die schweren Kürassiere des Kaisers.
"""

[miliz]
nahkampf = "recruit"
fernkampf = "musketeer"
nahkampf_elite = "pikeman"
fernkampf_elite = "veteran_musketeer"

[[lord_partei]]
truppe = "peasant"
min = 4
max = 8

[[lord_partei]]
truppe = "recruit"
min = 3
max = 6

[[lord_partei]]
truppe = "pikeman"
min = 2
max = 4

[[lord_partei]]
truppe = "musketeer"
min = 2
max = 4

[[lord_partei]]
truppe = "cuirassier"
min = 0
max = 2

