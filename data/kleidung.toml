# Kleidung aus Napoleonic Warfare (v0.1)
#
# tools/gen_content.py schreibt diese Teile nach Module/BalkanMod/ModuleData/balkan_items.xml. Die Modelle (mesh) stammen
# aus Napoleonic Warfare und sind NICHT für eine Veröffentlichung freigegeben (siehe NICHT_FREIGEGEBEN.md). Im Spiel
# sichtbar werden sie erst, wenn sie mit dem Modding Kit in AssetPackages/pack0.tpac gepackt sind.
#
# Felder: art = Kopf | Koerper | Beine; schutz_kopf/koerper/arme/beine = Rüstungswerte; gewicht in kg;
# kultur = Kultur-Id im Spiel; material = Stoff (Standard), Leder oder Platte. Den Preis berechnet das Spiel.

